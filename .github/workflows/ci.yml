name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    name: Lint & Test Suite (with PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_bot
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: discord_events_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check cogs database services utils tests main.py

      - name: Run Pytest Suite with Real PostgreSQL Container
        env:
          TEST_DATABASE_URL: postgresql://nexus_bot:test_password@localhost:5432/discord_events_test
          HEALTH_SERVER_PORT: "8089"
        run: |
          pytest -v --cov=. --cov-report=term-missing

  docker-build:
    name: Build & Validate Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nexus-bot:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
