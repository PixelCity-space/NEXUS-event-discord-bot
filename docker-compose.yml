version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-discord_events}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-discord_events}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_secret_pass}@postgres:5432/${POSTGRES_DB:-discord_events}
      HEALTH_SERVER_HOST: "0.0.0.0"
      HEALTH_SERVER_PORT: "8080"
      DB_POOL_MIN_SIZE: "5"
      DB_POOL_MAX_SIZE: "20"
      DB_COMMAND_TIMEOUT: "30.0"
    ports:
      - "${HEALTH_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs
      - ./config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nexus_net

networks:
  nexus_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
